<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    .hex { fill: none; stroke-width: 7; stroke-linejoin: round; stroke: #1e3a8a; }
    .tl  { fill: #1e3a8a; }
